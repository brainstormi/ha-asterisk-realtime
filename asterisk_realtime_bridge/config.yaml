name: Asterisk Realtime Bridge
version: "0.2.1"
slug: asterisk_realtime_bridge
description: Talk to Home Assistant by phone (Asterisk AudioSocket + OpenAI Realtime API) with barge-in.
url: https://github.com/brainstormi/ha-asterisk-realtime
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# Host networking lets the AudioSocket server listen on 127.0.0.1 only: reachable
# by Asterisk when it also runs on the host network (e.g. as another add-on),
# but not by the rest of the LAN or the internet.
host_network: true
homeassistant_api: true
options:
  openai_api_key: ""
  model: gpt-realtime-2.1
  voice: marin
  language: en
  assistant_name: Assistant
  pin_enabled: true
  pin: ""
  max_pin_attempts: 3
  max_call_seconds: 300
  max_concurrent_calls: 1
  conversation_agent: conversation.home_assistant
  fallback_agent: ""
  vad: server_vad
  vad_threshold: 0.5
  vad_silence_ms: 500
  noise_reduction: near_field
  port: 9092
  bind_address: 127.0.0.1
  log_level: info
  log_transcripts: false
schema:
  openai_api_key: password
  model: str
  voice: str
  language: str
  assistant_name: str
  pin_enabled: bool
  pin: password?
  max_pin_attempts: int(1,10)
  max_call_seconds: int(30,1800)
  max_concurrent_calls: int(1,3)
  conversation_agent: str
  fallback_agent: str?
  vad: list(server_vad|semantic_vad)
  vad_threshold: float(0.1,0.95)
  vad_silence_ms: int(200,2000)
  noise_reduction: list(near_field|far_field|off)
  port: port
  bind_address: str
  extra_instructions: str?
  log_level: list(debug|info|warning|error)
  log_transcripts: bool
