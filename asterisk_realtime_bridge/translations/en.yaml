configuration:
  openai_api_key:
    name: OpenAI API key
    description: Create a dedicated key in a project with a spending limit.
  model:
    name: Realtime model
    description: gpt-realtime-2.1 (default), gpt-realtime-2.1-mini (cheaper and faster, less capable) or gpt-realtime-2. GPT-Live is not supported yet.
  voice:
    name: Voice
    description: For example marin, cedar, alloy, coral, verse...
  language:
    name: Language
    description: Language code used by the assistant, Home Assistant conversation agents and transcription (en, es, de...).
  assistant_name:
    name: Assistant name
    description: How the assistant introduces itself.
  accent:
    name: Accent and dialect (optional)
    description: Steers the voice, e.g. "Spanish from Spain (Castilian), standard peninsular accent". The result depends on the model and voice; try different voices too.
  prompt:
    name: Assistant prompt (template)
    description: "How the assistant introduces itself and behaves. Placeholders: {assistant_name}, {language}, {language_name}, {accent_line} and {pin_rules} (the last two on a line of their own). Leave it empty to use the built-in template. Multi-line editing is easier with Edit in YAML; a literal \\n also works as a line break."
  pin_enabled:
    name: Require PIN
    description: If disabled, any call reaching the bridge can control the home (your Asterisk dialplan would be the only barrier).
  pin:
    name: Security PIN
    description: Digits only. Can be spoken or typed on the phone keypad. Required when "Require PIN" is on.
  max_pin_attempts:
    name: PIN attempts
    description: The call is hung up after this many failures.
  max_call_seconds:
    name: Maximum call length (s)
    description: Ends the call after this time to cap spending.
  max_concurrent_calls:
    name: Concurrent calls
    description: Maximum simultaneous calls.
  conversation_agent:
    name: Home Assistant conversation agent
    description: Agent that executes the commands. Defaults to the built-in Assist agent (no LLM), which only touches exposed entities.
  fallback_agent:
    name: Fallback agent (optional)
    description: Used when the main agent does not understand the command, for example conversation.openai_conversation. Adds latency and cost.
  vad:
    name: Turn detection
    description: server_vad (silence based) or semantic_vad (meaning based).
  vad_threshold:
    name: Voice threshold (server_vad)
    description: Raise it if the assistant interrupts itself because of noise or echo.
  vad_silence_ms:
    name: Silence to end a turn (ms)
    description: How much silence means the caller has finished speaking.
  noise_reduction:
    name: Noise reduction
    description: near_field for normal phone calls.
  port:
    name: AudioSocket port
    description: Port Asterisk connects to.
  bind_address:
    name: AudioSocket bind address
    description: Keep 127.0.0.1 if Asterisk runs on the same host. AudioSocket has no authentication; if you expose it, restrict access with a firewall.
  extra_instructions:
    name: Extra instructions
    description: Text appended to the default assistant instructions (for example, how your rooms and devices are named).
  log_level:
    name: Log level
    description: debug shows more detail.
  log_transcripts:
    name: Log transcripts
    description: Writes what is said to the log. This is private; enable only to debug.
